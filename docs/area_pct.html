<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Heatmap</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #heatmap {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="heatmap"></div>

  <script>
    const csvUrl = 'Area_pct.csv';

    fetch(csvUrl)
      .then(response => response.text())
      .then(csvText => {
        const data = Papa.parse(csvText.trim(), { dynamicTyping: true });
        const rows = data.data;

        const x = rows[0].slice(1); // Column headers
        const y = rows.slice(1).map(row => row[0]); // Row headers
        const z = rows.slice(1).map(row => row.slice(1).map(val => val == null || isNaN(val) ? 0 : parseFloat(val.toFixed(2))));

        const annotations = [];
        for (let i = 0; i < y.length; i++) {
          for (let j = 0; j < x.length; j++) {
            const value = z[i][j];            
            annotations.push({
              x: x[j],
              y: y[i],
              text: String(z[i][j]),
              font: {
                color: value > 40 ? 'white' : 'black',
                size: 10
              },
              showarrow: false
            });
          }
        }

        const trace = {
          z: z,
          x: x,
          y: y,
          type: 'heatmap',
          colorscale: 'YlGnBu'.split('').reverse().join(''), // Reversed colorscale
          hoverongaps: false,
          showscale: true,
          zsmooth: false
        };

        const layout = {
          title: 'Area by Forest Types (Percentages for each division)',
          xaxis: {
            title: '',
            automargin: true,
            tickangle: -45,
            side: 'bottom',
            ticks: 'outside'
          },
          yaxis: {
            title: 'Division Name',
            automargin: true,
            ticks: 'outside'
          },
          margin: { l: 150, r: 30, b: 150, t: 60 },
          annotations: annotations,
          dragmode: 'pan',
          plot_bgcolor: '#fff',
          paper_bgcolor: '#fff',
          shapes: []
        };

        // Add grid lines manually to enhance separation
        for (let i = 1; i < x.length; i++) {
          layout.shapes.push({
            type: 'line',
            x0: x[i], x1: x[i], y0: y[0], y1: y[y.length - 1],
            line: { color: 'rgba(0,0,0,0.1)', width: 1 },
            xref: 'x', yref: 'y'
          });
        }
        for (let j = 1; j < y.length; j++) {
          layout.shapes.push({
            type: 'line',
            x0: x[0], x1: x[x.length - 1], y0: y[j], y1: y[j],
            line: { color: 'rgba(0,0,0,0.1)', width: 1 },
            xref: 'x', yref: 'y'
          });
        }

        Plotly.newPlot('heatmap', [trace], layout, { responsive: true });
      });
  </script>
</body>
</html>
