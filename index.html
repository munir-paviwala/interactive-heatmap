<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Heatmap</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #heatmap {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="heatmap"></div>

  <script>
    // Replace this URL with your actual hosted CSV file URL
    const csvUrl = 'https://github.com/munir-paviwala/interactive-heatmap/Area_non_percent.csv';

    fetch(csvUrl)
      .then(response => response.text())
      .then(csvText => {
        const data = Papa.parse(csvText.trim(), { dynamicTyping: true });
        const rows = data.data;

        const x = rows[0].slice(1); // Column headers
        const y = rows.slice(1).map(row => row[0]); // Row headers
        const z = rows.slice(1).map(row => row.slice(1)); // Heatmap data

        const trace = {
          z: z,
          x: x,
          y: y,
          type: 'heatmap',
          colorscale: 'Viridis',
          hoverongaps: false
        };

        const layout = {
          title: 'Interactive Heatmap',
          xaxis: { title: 'Columns', automargin: true },
          yaxis: { title: 'Rows', automargin: true },
          margin: { l: 100, r: 50, b: 100, t: 50 },
          dragmode: 'pan'
        };

        Plotly.newPlot('heatmap', [trace], layout, {responsive: true});
      });
  </script>
</body>
</html>
